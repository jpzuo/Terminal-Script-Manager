# GitHub Actions 工作流：自动构建和发布 Tauri 应用
name: Release

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的 tag 时触发（如 v0.1.0）

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        # 如需支持更多平台，取消注释：
        # platform: [windows-latest, macos-latest, ubuntu-20.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整的 git 历史，包括所有 commits 和 tags

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 安装依赖
        run: pnpm install

      - name: 生成更新日志
        id: changelog
        run: |
          CHANGELOG=$(cat <<'EOF'
          ## 更新内容

          EOF
          )
          CHANGELOG="$CHANGELOG"$'\n'
          CHANGELOG="$CHANGELOG$(git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)")"
          echo "$CHANGELOG"
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: 构建并发布到 GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '终端脚本管理器 ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.CHANGELOG }}
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdaterJson: true
